<!-- @dsCard group="Type" viewport="700x150" name="Weights" subtitle="Matter SQ, weights 300 to 800" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--white); padding: 24px; color: var(--ink); }
  .row { display: flex; gap: 28px; align-items: baseline; flex-wrap: wrap; }
  .w { text-align: left; }
  .glyph { font-size: 40px; line-height: 1; letter-spacing: -1.5px; }
  .lab { font-family: var(--font-mono); font-size: 11px; color: var(--cloud-burst); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="w"><div class="glyph" style="font-weight:300">Aa</div><div class="lab">Light 300</div></div>
    <div class="w"><div class="glyph" style="font-weight:400">Aa</div><div class="lab">Regular 400</div></div>
    <div class="w"><div class="glyph" style="font-weight:500">Aa</div><div class="lab">Medium 500</div></div>
    <div class="w"><div class="glyph" style="font-weight:600">Aa</div><div class="lab">Semibold 600</div></div>
    <div class="w"><div class="glyph" style="font-weight:700">Aa</div><div class="lab">Bold 700</div></div>
    <div class="w"><div class="glyph" style="font-weight:800">Aa</div><div class="lab">Heavy 800</div></div>
  </div>
</body>
</html>
