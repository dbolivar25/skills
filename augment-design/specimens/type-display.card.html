<!-- @dsCard group="Type" viewport="700x340" name="Display headings" subtitle="Matter SQ, large, tight negative tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--white); padding: 24px; color: var(--ink); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .spec { font-family: var(--font-mono); font-size: 11px; color: var(--cloud-burst); white-space: nowrap; width: 120px; flex-shrink: 0; }
  .d72 { font-size: var(--fs-72); line-height: var(--lh-80); letter-spacing: var(--tracking-tightest); font-weight: var(--fw-medium); }
  .d48 { font-size: var(--fs-48); line-height: var(--lh-56); letter-spacing: var(--tracking-tight); font-weight: var(--fw-medium); }
  .d32 { font-size: var(--fs-32); line-height: var(--lh-40); letter-spacing: var(--tracking-snug); font-weight: var(--fw-semibold); }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="spec">72 / 80 · -2.5px</span><span class="d72">Everything worth knowing</span></div>
    <div class="line"><span class="spec">48 / 56 · -2px</span><span class="d48">Built for real work</span></div>
    <div class="line"><span class="spec">32 / 40 · -0.5px</span><span class="d32">Intelligence that keeps up with you</span></div>
  </div>
</body>
</html>
