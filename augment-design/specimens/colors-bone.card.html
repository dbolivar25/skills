<!-- @dsCard group="Colors" viewport="700x150" name="Bone, warm paper" subtitle="Warm neutrals for calm document and marketing canvases" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--white); padding: 20px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-8); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .name { font-size: 13px; font-weight: var(--fw-medium); color: var(--ink); margin: 8px 0 1px; letter-spacing: -0.1px; }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--cloud-burst); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--bone-100)"></div><div class="name">bone-100</div><div class="hex">#F6F1EF</div></div>
    <div class="sw"><div class="chip" style="background:var(--bone-300)"></div><div class="name">bone-300</div><div class="hex">#E6DAD8</div></div>
    <div class="sw"><div class="chip" style="background:var(--bone-500)"></div><div class="name">bone-500</div><div class="hex">#E9E1E1</div></div>
    <div class="sw"><div class="chip" style="background:var(--white);box-shadow:inset 0 0 0 1px var(--neutral-85)"></div><div class="name">white</div><div class="hex">#FFFFFF</div></div>
  </div>
</body>
</html>
