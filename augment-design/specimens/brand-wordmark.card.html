<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--white); padding: 0; color: var(--ink); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; height: 180px; }
  .cell { display: flex; align-items: center; justify-content: center; }
  .light { background: var(--white); border-right: 1px solid var(--neutral-75); }
  .color { background: var(--bone-100); }
  img { width: 200px; height: auto; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell light"><img src="../assets/logo/augment-wordmark-black.svg" alt="Augment wordmark black"></div>
    <div class="cell color"><img src="../assets/logo/augment-wordmark-color.svg" alt="Augment wordmark color"></div>
  </div>
</body>
</html>
