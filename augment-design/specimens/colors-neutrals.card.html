<!-- @dsCard group="Colors" viewport="700x150" name="Ink & cool neutrals" subtitle="Stable cool temperature for text and chrome" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--white); padding: 20px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-8); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .name { font-size: 13px; font-weight: var(--fw-medium); color: var(--ink); margin: 8px 0 1px; letter-spacing: -0.1px; }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--cloud-burst); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="name">ink</div><div class="hex">#040919</div></div>
    <div class="sw"><div class="chip" style="background:var(--woodsmoke)"></div><div class="name">woodsmoke</div><div class="hex">#2B2D39</div></div>
    <div class="sw"><div class="chip" style="background:var(--cloud-burst)"></div><div class="name">cloud-burst</div><div class="hex">#6F7288</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-100)"></div><div class="name">neutral-100</div><div class="hex">#AFAEB1</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-85)"></div><div class="name">neutral-85</div><div class="hex">#E3E3E8</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-50)"></div><div class="name">neutral-50</div><div class="hex">#F4F6F6</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-25)"></div><div class="name">neutral-25</div><div class="hex">#FAFBFB</div></div>
  </div>
</body>
</html>
