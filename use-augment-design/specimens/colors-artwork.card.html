<!-- @dsCard group="Colors" viewport="700x150" name="Artwork & atmosphere hues" subtitle="The hues that build the swirl. Atmosphere and artwork only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--white); padding: 20px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-8); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .name { font-size: 13px; font-weight: var(--fw-medium); color: var(--ink); margin: 8px 0 1px; letter-spacing: -0.1px; }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--cloud-burst); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--arctic)"></div><div class="name">arctic</div><div class="hex">#AEE3E4</div></div>
    <div class="sw"><div class="chip" style="background:var(--frost)"></div><div class="name">frost</div><div class="hex">#B4C1FA</div></div>
    <div class="sw"><div class="chip" style="background:var(--oink)"></div><div class="name">oink</div><div class="hex">#F7C5DA</div></div>
    <div class="sw"><div class="chip" style="background:var(--peach)"></div><div class="name">peach</div><div class="hex">#FBD6A9</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold)"></div><div class="name">gold</div><div class="hex">#FFBE5C</div></div>
  </div>
</body>
</html>
