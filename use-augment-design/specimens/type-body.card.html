<!-- @dsCard group="Type" viewport="700x220" name="Body & UI text" subtitle="Readable copy sizes, 15 to 20px, regular and medium" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--white); padding: 24px; color: var(--ink); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .spec { font-family: var(--font-mono); font-size: 11px; color: var(--cloud-burst); white-space: nowrap; width: 120px; flex-shrink: 0; }
  .t20 { font-size: var(--fs-20); line-height: var(--lh-32); letter-spacing: var(--tracking-tiny); color: var(--woodsmoke); max-width: var(--measure-56); }
  .t15 { font-size: var(--fs-15); line-height: var(--lh-24); color: var(--woodsmoke); max-width: var(--measure-56); }
  .t13 { font-size: var(--fs-13); line-height: var(--lh-16); color: var(--cloud-burst); }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="spec">20 / 32 lead</span><span class="t20">Augment reads every connected source and answers with the records, numbers, and history that matter.</span></div>
    <div class="line"><span class="spec">15 / 24 body</span><span class="t15">Augment surfaces what changed, lays out the options, and shows the sources before you act.</span></div>
    <div class="line"><span class="spec">13 / 16 caption</span><span class="t13">Resolved 12 of 14 items · 1.2s</span></div>
  </div>
</body>
</html>
