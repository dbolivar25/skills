<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Augment logo specimens</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: var(--space-32);
      font-family: var(--font-sans);
      color: var(--ink);
      background: var(--neutral-25);
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      display: grid;
      gap: var(--space-24);
    }
    h1, p { margin: 0; }
    h1 {
      font-size: var(--fs-40);
      line-height: var(--lh-48);
      letter-spacing: var(--tracking-tight);
      font-weight: var(--fw-medium);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-16);
    }
    .panel {
      min-height: 180px;
      display: grid;
      align-content: center;
      gap: var(--space-16);
      padding: var(--space-24);
      border-radius: var(--radius-16);
      border: 1px solid var(--border-subtle);
      background: var(--white);
      box-shadow: var(--shadow-1);
    }
    .panel.dark {
      color: var(--white);
      background: var(--ink);
      border-color: var(--border-on-dark);
    }
    .panel.paper {
      background: var(--bone-100);
    }
    .label {
      font-size: var(--fs-12);
      line-height: var(--lh-16);
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      color: var(--cloud-burst);
      font-weight: var(--fw-medium);
    }
    .dark .label { color: rgba(255, 255, 255, 0.64); }
    .wordmark { width: min(280px, 100%); height: auto; }
    .mark {
      width: 64px;
      height: 64px;
      color: var(--burgundy-600);
    }
  </style>
</head>
<body>
  <main>
    <h1>Logo specimens</h1>
    <div class="grid">
      <section class="panel">
        <img class="wordmark" src="../assets/logo/augment-wordmark-black.svg" alt="Augment wordmark in black">
        <p class="label">Black wordmark on light</p>
      </section>
      <section class="panel paper">
        <img class="wordmark" src="../assets/logo/augment-wordmark-color.svg" alt="Augment color wordmark">
        <p class="label">Color lockup on paper</p>
      </section>
      <section class="panel dark">
        <img class="wordmark" src="../assets/logo/augment-wordmark-on-dark.svg" alt="Augment wordmark on dark">
        <p class="label">Wordmark on dark</p>
      </section>
      <section class="panel">
        <img class="mark" src="../assets/logo/augment-mark.svg" alt="Augment mark">
        <p class="label">Standalone mark</p>
      </section>
    </div>
  </main>
</body>
</html>
