<!-- @dsCard group="Colors" viewport="700x140" name="Semantic state" subtitle="Success, warning, and error, used as signal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--white); padding: 20px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-8); display: flex; align-items: center; padding: 0 14px; color: var(--white); font-size: 14px; font-weight: var(--fw-semibold); }
  .name { font-size: 13px; font-weight: var(--fw-medium); color: var(--ink); margin: 8px 0 1px; }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--cloud-burst); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--green)">Success</div><div class="name">green</div><div class="hex">#00C000</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold);color:var(--ink)">Warning</div><div class="name">gold</div><div class="hex">#FFBE5C</div></div>
    <div class="sw"><div class="chip" style="background:var(--red)">Error</div><div class="name">red</div><div class="hex">#ED4343</div></div>
  </div>
</body>
</html>
