<!-- @dsCard group="Colors" viewport="700x150" name="Brand: burgundy and plum" subtitle="The burgundy-plum spine; mark pink is the vivid accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--white); padding: 20px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-8); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .name { font-size: 13px; font-weight: var(--fw-medium); color: var(--ink); margin: 8px 0 1px; letter-spacing: -0.1px; }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--cloud-burst); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--burgundy-600)"></div><div class="name">burgundy-600</div><div class="hex">#660033</div></div>
    <div class="sw"><div class="chip" style="background:var(--burgundy-700)"></div><div class="name">burgundy-700</div><div class="hex">#4D0026</div></div>
    <div class="sw"><div class="chip" style="background:var(--burgundy-800)"></div><div class="name">burgundy-800</div><div class="hex">#3D001E</div></div>
    <div class="sw"><div class="chip" style="background:var(--plum-500)"></div><div class="name">plum-500</div><div class="hex">#852D5A</div></div>
    <div class="sw"><div class="chip" style="background:var(--plum-600)"></div><div class="name">plum-600</div><div class="hex">#621E50</div></div>
    <div class="sw"><div class="chip" style="background:var(--plum-700)"></div><div class="name">plum-700</div><div class="hex">#4F2A3C</div></div>
    <div class="sw"><div class="chip" style="background:var(--mark-pink)"></div><div class="name">mark pink</div><div class="hex">#CF0147</div></div>
  </div>
</body>
</html>
