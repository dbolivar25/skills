<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Augment component specimens</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: var(--space-32);
      font-family: var(--font-sans);
      color: var(--ink);
      background: var(--white);
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      display: grid;
      gap: var(--space-32);
    }
    h1, h2, p { margin: 0; }
    h1 {
      font-size: var(--fs-40);
      line-height: var(--lh-48);
      letter-spacing: var(--tracking-tight);
      font-weight: var(--fw-medium);
    }
    h2 {
      font-size: var(--fs-18);
      line-height: var(--lh-24);
      font-weight: var(--fw-semibold);
    }
    section {
      display: grid;
      gap: var(--space-16);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-12);
    }
    .button {
      min-height: 40px;
      padding: 0 var(--space-16);
      border-radius: var(--radius-8);
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-8);
      font-family: var(--font-sans);
      font-size: var(--fs-15);
      line-height: var(--lh-24);
      font-weight: var(--fw-semibold);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .button > span { position: relative; z-index: 1; }
    .primary { color: var(--white); }
    .secondary { color: var(--ink); background: var(--white); border-color: var(--border-default); box-shadow: var(--shadow-1); }
    .ghost { color: var(--woodsmoke); background: transparent; border-color: transparent; }
    .danger { color: var(--white); background: var(--red); }
    .disabled { opacity: 0.4; }
    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: var(--radius-8);
    }
    .badge, .tag {
      display: inline-flex;
      align-items: center;
      gap: var(--space-8);
      min-height: 28px;
      padding: 0 var(--space-12);
      border-radius: var(--radius-pill);
      font-size: var(--fs-13);
      line-height: var(--lh-16);
      font-weight: var(--fw-semibold);
      border: 1px solid transparent;
    }
    .badge.neutral { color: var(--woodsmoke); background: var(--neutral-50); }
    .badge.brand { color: var(--white); background: var(--burgundy-600); }
    .badge.success { color: var(--ink); background: rgba(0, 192, 0, 0.12); }
    .badge.warning { color: var(--ink); background: rgba(255, 190, 92, 0.24); }
    .badge.error { color: var(--red); background: rgba(237, 67, 67, 0.12); }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: var(--radius-circle);
      background: currentColor;
    }
    .tag {
      border-color: var(--border-default);
      border-radius: var(--radius-8);
      background: var(--white);
      color: var(--woodsmoke);
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-circle);
      display: inline-grid;
      place-items: center;
      font-weight: var(--fw-semibold);
      color: var(--white);
      background: var(--woodsmoke);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .avatar span { position: relative; z-index: 1; }
    .field {
      display: grid;
      gap: 6px;
      min-width: min(280px, 100%);
    }
    label {
      font-size: var(--fs-13);
      line-height: var(--lh-16);
      font-weight: var(--fw-semibold);
      color: var(--woodsmoke);
    }
    input, select, textarea {
      width: 100%;
      min-height: 40px;
      border-radius: var(--radius-8);
      border: 1px solid var(--border-default);
      padding: 0 var(--space-12);
      font: inherit;
      color: var(--ink);
      background: var(--white);
      outline: none;
    }
    textarea {
      min-height: 88px;
      padding-top: var(--space-8);
      resize: vertical;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 3px rgba(102, 0, 51, 0.14);
    }
    .hint {
      font-size: var(--fs-13);
      line-height: var(--lh-16);
      color: var(--cloud-burst);
    }
    .check, .switch {
      display: inline-flex;
      align-items: center;
      gap: var(--space-8);
      font-size: var(--fs-15);
      color: var(--woodsmoke);
    }
    .box {
      width: 18px;
      height: 18px;
      border-radius: var(--radius-4);
      border: 1px solid var(--burgundy-600);
      background: var(--burgundy-600);
      color: var(--white);
      display: grid;
      place-items: center;
      font-size: 12px;
    }
    .track {
      width: 38px;
      height: 22px;
      border-radius: var(--radius-pill);
      background: var(--burgundy-600);
      position: relative;
    }
    .knob {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 16px;
      height: 16px;
      border-radius: var(--radius-circle);
      background: var(--white);
      box-shadow: var(--shadow-1);
    }
    .card {
      width: min(320px, 100%);
      padding: var(--space-20);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-16);
      background: var(--white);
      box-shadow: var(--shadow-1);
    }
    .banner, .toast {
      display: flex;
      gap: var(--space-12);
      align-items: flex-start;
      padding: var(--space-12) var(--space-16);
      border-radius: var(--radius-8);
      border: 1px solid var(--border-subtle);
      background: var(--neutral-25);
      color: var(--woodsmoke);
      max-width: 420px;
    }
    .toast {
      background: var(--white);
      box-shadow: var(--shadow-3);
    }
    .rail {
      width: 3px;
      align-self: stretch;
      border-radius: var(--radius-pill);
      background: var(--burgundy-600);
      flex: 0 0 auto;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border-radius: var(--radius-circle);
      border: 2px solid rgba(102, 0, 51, 0.18);
      border-top-color: var(--burgundy-600);
    }
  </style>
</head>
<body>
  <main>
    <h1>Component specimens</h1>

    <section aria-labelledby="buttons">
      <h2 id="buttons">Buttons</h2>
      <div class="row">
        <button class="button primary aug-glow aug-glow--brand" type="button"><span class="aug-glow__layer" aria-hidden="true"></span><span>Primary</span></button>
        <button class="button secondary" type="button">Secondary</button>
        <button class="button ghost" type="button">Ghost</button>
        <button class="button danger" type="button">Danger</button>
        <button class="button secondary disabled" type="button" disabled>Disabled</button>
        <button class="button secondary icon-button" type="button" aria-label="Icon action">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </section>

    <section aria-labelledby="labels">
      <h2 id="labels">Badges, tags, avatars</h2>
      <div class="row">
        <span class="badge neutral">Neutral</span>
        <span class="badge brand">Brand</span>
        <span class="badge success"><span class="dot"></span>Success</span>
        <span class="badge warning">Warning</span>
        <span class="badge error"><span class="dot"></span>Error</span>
        <span class="tag">Tag</span>
        <span class="tag">Selected</span>
        <span class="avatar"><span>Au</span></span>
        <span class="avatar aug-glow aug-glow--brand"><span class="aug-glow__layer" aria-hidden="true"></span><span>Au</span></span>
      </div>
    </section>

    <section aria-labelledby="forms">
      <h2 id="forms">Forms</h2>
      <div class="row">
        <div class="field">
          <label for="input">Input label</label>
          <input id="input" value="Input value">
          <p class="hint">Helper text</p>
        </div>
        <div class="field">
          <label for="select">Select label</label>
          <select id="select"><option>Option one</option><option>Option two</option></select>
        </div>
        <div class="field">
          <label for="textarea">Textarea label</label>
          <textarea id="textarea">Longer value</textarea>
        </div>
        <span class="check">
          <span class="box">
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 12 4 4L19 6" />
            </svg>
          </span>
          Checkbox
        </span>
        <span class="switch"><span class="track"><span class="knob"></span></span>Switch</span>
      </div>
    </section>

    <section aria-labelledby="surfaces">
      <h2 id="surfaces">Surfaces and feedback</h2>
      <div class="row">
        <div class="card">
          <p style="font-size: var(--fs-18); line-height: var(--lh-24); font-weight: var(--fw-semibold);">Card surface</p>
          <p style="margin-top: var(--space-8); font-size: var(--fs-15); line-height: var(--lh-24); color: var(--woodsmoke);">Neutral framed content.</p>
        </div>
        <div class="banner"><div class="rail"></div><div><strong>Banner title</strong><p style="margin-top: 4px;">Banner message.</p></div></div>
        <div class="toast"><div class="rail"></div><div><strong>Toast title</strong><p style="margin-top: 4px;">Toast message.</p></div></div>
        <span class="row" style="gap: var(--space-8);"><span class="spinner" aria-hidden="true"></span><span>Loading</span></span>
      </div>
    </section>
  </main>
</body>
</html>
