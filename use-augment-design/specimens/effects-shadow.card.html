<!-- @dsCard group="Effects" viewport="700x190" name="Shadow elevation" subtitle="Numbered levels that carry depth" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--neutral-25); padding: 28px 24px; color: var(--ink); }
  .row { display: flex; gap: 24px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 84px; height: 84px; background: var(--white); border-radius: var(--radius-16); }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--cloud-burst); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="box-shadow:var(--shadow-1)"></div><div class="v">shadow-1</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-2)"></div><div class="v">shadow-2</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-3)"></div><div class="v">shadow-3</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-4)"></div><div class="v">shadow-4</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-5)"></div><div class="v">shadow-5</div></div>
  </div>
</body>
</html>
