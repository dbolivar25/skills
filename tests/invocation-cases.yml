version: 1

# Routing expectations, not recorded model results. read/do_not_read describe
# initial method selection; later evidence or a satisfied gate may enable another branch.
cases:
  - id: ordinary-gh-read
    kind: negative
    prompt: "Show me the title and URL for PR 42 with gh pr view."
    expect:
      primary:
      also_load: []
      do_not_load: ["github-evidence","review","show-me"]
    why: "Ordinary GitHub porcelain is sufficient, and lexical \"show me\" requests data rather than a visual explanation, verdict, or publication artifact."

  - id: complete-pr-evidence
    kind: positive
    prompt: "Get the complete live state of this PR, including unresolved review threads and the failing CI step, but do not judge whether it should merge."
    expect:
      primary: github-evidence
      also_load: []
      do_not_load: ["review"]
    why: "The request needs evidence that ordinary GitHub porcelain omits, while explicitly withholding the review verdict."

  - id: current-pr-verdict
    kind: collision
    prompt: "Review this pull request for correctness and tell me whether it is ready to merge, using current checks and unresolved threads."
    expect:
      primary: review
      also_load: ["github-evidence"]
      do_not_load: []
      read: ["review/branches/code-judgment.md"]
      do_not_read: ["review/branches/review-artifact.md"]
    why: "Code review owns the verdict; GitHub evidence supplies live state; no publication artifact was requested."

  - id: live-pr-description
    kind: collision
    prompt: "Draft the pull request description for my current branch from the live base-to-head change."
    expect:
      primary: review
      also_load: []
      do_not_load: ["github-evidence"]
      read: ["review/branches/review-artifact.md","review/references/pull-request.md"]
      do_not_read: ["review/branches/code-judgment.md"]
    why: "The requested artifact is a PR description derived from the local base-to-head change and its reviewer decision map, not a new merge verdict or a complete GitHub-state investigation."

  - id: visualize-review-decision
    kind: collision
    prompt: "Show me the three decisions this reviewer has to make and how the evidence feeds each one."
    expect:
      primary: show-me
      also_load: ["review"]
      do_not_load: []
      read: ["show-me/references/visual-forms.md","review/references/reconstruct-work.md"]
      do_not_read: ["review/branches/code-judgment.md","show-me/references/experiments.md"]
    why: "The user requested a visual explanation of a review model, not PR publication copy."

  - id: production-cause-only
    kind: collision
    prompt: "Diagnose why this production request is slow using current Grafana traces and logs. Find the cause, but do not change code."
    expect:
      primary: diagnosing-bugs
      also_load: ["grafana-evidence"]
      do_not_load: ["software-engineering"]
      do_not_read: ["software-engineering/branches/test-first.md","software-engineering/branches/finishing.md"]
    why: "Diagnosis owns hypothesis falsification and Grafana owns telemetry acquisition; the read-only boundary excludes implementation skills."

  - id: production-evidence-only
    kind: collision
    prompt: "Quantify this service's 5xx rate and latency change from current Grafana telemetry, with reproducible queries and deeplinks. Do not diagnose the cause."
    expect:
      primary: grafana-evidence
      also_load: []
      do_not_load: ["diagnosing-bugs","review"]
    why: "The requested outcome is a bounded reproducible evidence packet; causal diagnosis and merge judgment are explicitly outside scope."

  - id: test-first-bug-fix
    kind: collision
    prompt: "Find the cause of this flaky TypeScript behavior and fix it test-first with one failing integration test per slice."
    expect:
      primary: software-engineering
      also_load: ["diagnosing-bugs"]
      do_not_load: []
      read: ["software-engineering/branches/test-first.md","software-engineering/references/testing-evidence.md"]
      do_not_read: ["software-engineering/branches/finishing.md"]
    why: "The user explicitly chose test-driven implementation; diagnosis and TypeScript law support it, while the finishing pass waits for a verified boundary."

  - id: authorized-finishing-pass
    kind: collision
    prompt: "The authorized TypeScript implementation is complete and its focused tests pass. Simplify the changed code without changing behavior."
    expect:
      primary: software-engineering
      also_load: []
      do_not_load: ["diagnosing-bugs"]
      read: ["software-engineering/references/standards.md","software-engineering/branches/finishing.md"]
      do_not_read: ["software-engineering/branches/test-first.md"]
    why: "The request is a behavior-preserving finishing pass at an already verified boundary, not renewed diagnosis or test-driven feature work."

  - id: restore-human-voice
    kind: positive
    prompt: "This note says what I mean, but it sounds synthetic and nothing like me. Humanize it without changing the claims."
    expect:
      primary: humanize
      also_load: []
      do_not_load: ["writing-for-agents"]
    why: "Restore human voice while preserving claims; agent-instruction architecture is not the task."

  - id: ordinary-summary
    kind: negative
    prompt: "Give me a two-sentence summary of the material above."
    expect:
      primary:
      also_load: []
      do_not_load: ["humanize","writing-for-agents"]
    why: "Ordinary summarization has neither a voice defect nor an agent-instruction design problem."

  - id: ideas-from-blank
    kind: positive
    prompt: "I am stuck. Generate several specific directions for a new onboarding concept using one creative method."
    expect:
      primary: creative-ideation
      also_load: []
      do_not_load: ["creative-shaping"]
    why: "The user needs divergence from a blank starting point rather than transformation of supplied material."

  - id: shape-existing-options
    kind: collision
    prompt: "Take these five rough onboarding concepts, subvert the obvious ones, combine the strongest parts, and sharpen the final directions."
    expect:
      primary: creative-shaping
      also_load: ["creative-ideation"]
      do_not_load: []
    why: "Existing material activates the deep shaping branch while the parent retains method selection and anti-generic routing policy."

  - id: generic-interface-design
    kind: positive
    prompt: "Design the interaction states and responsive behavior for this unbranded settings panel."
    expect:
      primary: designing-human-interfaces
      also_load: []
      do_not_load: ["augment-design","show-me"]
      do_not_read: ["show-me/references/experiments.md"]
    why: "The task needs production interface craft but has neither an Augment identity constraint nor a throwaway learning goal."

  - id: throwaway-interface-prototype
    kind: collision
    prompt: "Build a disposable local UI to learn whether this state transition makes sense. We will throw the code away."
    expect:
      primary: show-me
      also_load: ["designing-human-interfaces"]
      do_not_load: ["augment-design"]
      read: ["show-me/references/experiments.md","show-me/branches/logic-experiment.md"]
      do_not_read: ["show-me/branches/ui-experiment.md","show-me/references/visual-forms.md"]
    why: "The unresolved state transition selects a logic experiment even though its controls are a UI; visual variants would answer a different question."

  - id: augment-product-interface
    kind: collision
    prompt: "Design and implement an Augment-branded approval settings screen with complete interaction states."
    expect:
      primary: designing-human-interfaces
      also_load: ["augment-design"]
      do_not_load: ["show-me"]
      do_not_read: ["show-me/references/experiments.md"]
    why: "Interface craft owns the human interaction and Augment design supplies the brand law; the requested result is production work, not a disposable probe."

  - id: visible-ai-work-product-workflow
    kind: collision
    prompt: "Build an Augment workflow that derives a customer-facing decision brief from CRM state and renders it as an Augment document."
    expect:
      primary: augment-workflows
      also_load: ["faithful-derivation","augment-design"]
      do_not_load: []
    why: "Workflow mechanics own the executable graph, derivation owns evidential fidelity, and Augment design owns the visible branded surface."

  - id: mechanical-workflow-inspection
    kind: positive
    prompt: "Inspect this Decision Site workflow for invalid node references and lifecycle errors. It does not generate a visible AI work product."
    expect:
      primary: augment-workflows
      also_load: []
      do_not_load: ["faithful-derivation","augment-design"]
    why: "The request is limited to executable workflow mechanics and explicitly excludes the neighboring derivation and presentation triggers."

  - id: compare-module-seams
    kind: collision
    prompt: "Compare two interface and seam shapes for this TypeScript module. Do not scan the wider repository or write a full spec."
    expect:
      primary: software-engineering
      also_load: []
      do_not_load: ["architecture"]
      read: ["software-engineering/references/module-design.md","software-engineering/branches/design-alternatives.md"]
      do_not_read: ["architecture/branches/scan.md","architecture/branches/spec.md"]
    why: "The task is a bounded module-design judgment under TypeScript law, not either user-invoked workflow."

  - id: explicit-architecture-scan
    kind: collision
    prompt: "/architecture Scan this TypeScript feature and rank evidence-backed ownership moves. Stop before designing an interface."
    expect:
      primary: architecture
      also_load: []
      do_not_load: []
      read: ["architecture/branches/scan.md","software-engineering/references/standards.md"]
      do_not_read: ["architecture/branches/spec.md"]
    why: "The user explicitly selected the read-only scan, whose boundary excludes the downstream specification workflow."

  - id: explicit-typed-spec
    kind: collision
    prompt: "/architecture Turn the accepted ownership move into a typed call-stack architecture handoff. Do not implement it."
    expect:
      primary: architecture
      also_load: []
      do_not_load: ["domain-modeling"]
      read: ["architecture/branches/spec.md","software-engineering/references/standards.md","software-engineering/branches/test-first.md"]
      do_not_read: ["architecture/branches/scan.md"]
    why: "The requested spec starts directly from accepted context. Shared engineering references support a typed design and vertical test plan; reading RGR for planning does not start implementation or a preliminary scan."

  - id: proposed-abstraction-gate
    kind: collision
    prompt: "Should we introduce this new service abstraction, or can the present need be met through a smaller seam?"
    expect:
      primary: engineering-restraint
      also_load: ["software-engineering"]
      do_not_load: ["architecture"]
      read: ["software-engineering/references/module-design.md"]
      do_not_read: ["architecture/branches/spec.md"]
    why: "The first judgment is whether the machinery is justified; detailed specification would be premature."

  - id: sharpen-domain-language
    kind: positive
    prompt: "Pressure-test whether Order, Reservation, and Hold are the right domain terms against these examples and invariants."
    expect:
      primary: domain-modeling
      also_load: []
      do_not_load: ["software-engineering"]
    why: "The uncertainty is in the domain model and ubiquitous language, not the shape of a code module."

  - id: explicit-grill
    kind: positive
    prompt: "Grill this launch plan through relentless dependency-aware questions, one round at a time."
    expect:
      primary: grilling
      also_load: []
      do_not_load: ["steward","engineering-restraint"]
    why: "The user explicitly requested the questioning protocol rather than durable mission state or an additive-machinery gate."

  - id: durable-owner-mission
    kind: positive
    prompt: "Steward this multi-week refactor so my intent survives handoffs and correctness, delivery, and landing are proved separately."
    expect:
      primary: steward
      also_load: []
      do_not_load: ["grilling"]
      read: ["steward/branches/durable-work.md"]
    why: "The user needs durable intent, independent acceptance, and landing receipts across time; questioning alone cannot preserve that state."

  - id: ordinary-bounded-task
    kind: negative
    prompt: "Rename this local variable and run the existing focused test."
    expect:
      primary:
      also_load: []
      do_not_load: ["steward","grilling"]
    why: "A small bounded edit needs neither durable mission machinery nor an owner interview."

  - id: repository-lint-policy
    kind: collision
    prompt: "This TypeScript repository repeatedly violates a proved mechanical policy. Turn it into a tested Biome GritQL rule using the installed version."
    expect:
      primary: write-custom-lint
      also_load: ["software-engineering"]
      do_not_load: []
      read: ["software-engineering/references/standards.md"]
      do_not_read: ["software-engineering/branches/finishing.md"]
    why: "The outcome is durable mechanical enforcement under repository law, not a one-time readability edit."

  - id: agent-facing-tool-contract
    kind: collision
    prompt: "Rewrite this model-facing tool description so its invocation boundary is precise and downstream agents parse every condition consistently."
    expect:
      primary: writing-for-agents
      also_load: []
      do_not_load: ["humanize"]
    why: "Agent-document architecture owns invocation and precise conditions; human voice is not the requested quality."

  - id: decision-standing
    kind: collision
    prompt: "Before you block my already-authorized reversible change over your quality preference, establish who owns that decision and resolve the facts you can check."
    expect:
      primary: steward
      also_load: []
      do_not_load: ["grilling"]
      read: ["steward/branches/decision-rights.md"]
      do_not_read: ["steward/branches/durable-work.md"]
    why: "Immediate standing is a distinct branch inside Steward; it must not open durable runtime or impose mission review."

  - id: routine-owner-choice
    kind: negative
    prompt: "Use the blue option we already selected and update this local mockup."
    expect:
      primary:
      also_load: []
      do_not_load: ["steward","grilling"]
    why: "An accepted routine choice does not need another authority dispute or interview."

  - id: ordinary-ts-implementation
    kind: positive
    prompt: "Implement the already-specified TypeScript retry policy using the repository conventions. I have not selected a test-first workflow."
    expect:
      primary: software-engineering
      also_load: []
      do_not_load: []
      read: ["software-engineering/references/standards.md"]
      do_not_read: ["software-engineering/branches/test-first.md"]
    why: "Engineering law applies without silently selecting RGR."

  - id: standalone-comment-clarity
    kind: positive
    prompt: "Review these Rust code comments for clarity and propose edits. Do not modify the files."
    expect:
      primary: software-engineering
      also_load: []
      do_not_load: []
      read: ["software-engineering/branches/finishing.md"]
      do_not_read: ["software-engineering/references/standards.md","software-engineering/branches/test-first.md"]
    why: "Comment clarity is language-general and read-only; TypeScript law and implementation workflow are not selected."

  - id: non-code-review-guide
    kind: positive
    prompt: "Prepare a review guide for this operating proposal so the finance lead can judge its assumptions and evidence."
    expect:
      primary: review
      also_load: []
      do_not_load: []
      read: ["review/references/reconstruct-work.md","review/branches/review-artifact.md"]
      do_not_read: ["review/branches/code-judgment.md","review/references/github-pr-operations.md"]
    why: "A non-code artifact needs faithful reconstruction, not repository axes or GitHub operations."

  - id: explain-known-flow
    kind: positive
    prompt: "Show the control flow of this known save operation as a small diagram. We already know how it works."
    expect:
      primary: show-me
      also_load: []
      do_not_load: []
      read: ["show-me/references/visual-forms.md"]
      do_not_read: ["show-me/references/experiments.md","show-me/branches/logic-experiment.md"]
    why: "Explain established evidence without imposing a prototype lifecycle."

  - id: explore-ui-directions
    kind: positive
    prompt: "Prototype three structurally different layouts for this settings page so I can choose a direction."
    expect:
      primary: show-me
      also_load: []
      do_not_load: []
      read: ["show-me/references/experiments.md","show-me/branches/ui-experiment.md"]
      do_not_read: ["show-me/branches/logic-experiment.md"]
    why: "Unsettled presentation needs structural UI variants, not a state model experiment."

  - id: review-and-description
    kind: positive
    prompt: "Review this local code change for correctness, then draft its PR description from the same diff. Do not publish anything."
    expect:
      primary: review
      also_load: []
      do_not_load: []
      read: ["review/references/reconstruct-work.md","review/branches/code-judgment.md","review/branches/review-artifact.md"]
    why: "Both branches reuse the same evidence while delivering distinct requested outcomes."

  - id: architecture-unclear-spec
    kind: collision
    prompt: "/architecture Write a typed spec for this change. The repository establishes the current design, but the user-visible cancellation behavior is unresolved."
    expect:
      primary: architecture
      also_load: []
      do_not_load: []
      read: ["architecture/branches/spec.md"]
      do_not_read: ["architecture/branches/scan.md"]
    why: "The spec branch researches current facts and uses grilling for the unresolved design decision; it does not begin with a scan."
