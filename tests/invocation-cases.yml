version: 1

# Expected selection, not measured model behavior. These are decisive required
# capabilities and exclusions, not exhaustive load traces. Core and workflow
# skills both use SKILL.md; reading a passive method does not select its owner's
# operational workflow. Effects follow the task's authority, not a skill name.
